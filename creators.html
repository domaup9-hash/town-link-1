<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صناع المحتوى | KAYAN CFW Creators</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #07090e;
            --bg-card: #11141d;
            --accent: #e50914;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border: #1f2433;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); direction: rtl; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: rgba(7, 9, 14, 0.95); border-bottom: 1px solid var(--border); }
        .logo-area { display: flex; align-items: center; gap: 12px; font-weight: bold; font-size: 1.2rem; }
        .nav-links { display: flex; gap: 30px; list-style: none; }
        .nav-links a { color: var(--text-muted); text-decoration: none; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        
        .container { width: 85%; max-width: 1300px; margin: 0 auto; padding: 60px 0; }
        .page-title { font-size: 2.5rem; margin-bottom: 10px; text-align: center; }
        .page-subtitle { color: var(--text-muted); text-align: center; margin-bottom: 50px; }
        
        .creators-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .creator-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 30px; text-align: center; transition: 0.3s; }
        .creator-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .creator-avatar { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--accent); margin: 0 auto 20px; object-fit: cover; }
        .creator-name { font-size: 1.3rem; margin-bottom: 8px; }
        .creator-platform { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .watch-btn { background: #9146FF; color: white; border: none; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
        .watch-btn:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo-area">
            <i class="fa-solid fa-video" style="color: var(--accent);"></i>
            <span>KAYAN CREATORS</span>
        </div>
        <ul class="nav-links">
            <li><a href="/">الرئيسية</a></li>
            <li><a href="/rules">القوانين</a></li>
            <li><a href="/creators" class="active">صناع المحتوى</a></li>
            <li><a href="/apply">التقديم</a></li>
            <li><a href="/store">المتجر</a></li>
        </ul>
    </header>

    <div class="container">
        <h1 class="page-title">صناع المحتوى في كيان</h1>
        <p class="page-subtitle">تابع أضخم البثوث ومقاطع الرول بلاي المميزة لنجوم مجتمع كيان.</p>
        
        <div class="creators-grid">
            <div class="creator-card">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" alt="Creator" class="creator-avatar">
                <h3 class="creator-name">DOMA_RP</h3>
                <div class="creator-platform"><i class="fa-brands fa-twitch" style="color: #9146FF;"></i> توب ستريمر - عوالم الجريمة</div>
                <a href="https://twitch.tv" target="_blank" class="watch-btn"><i class="fa-solid fa-play"></i> مشاهدة البث</a>
            </div>

            <div class="creator-card">
                <img src="https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=150" alt="Creator" class="creator-avatar">
                <h3 class="creator-name">Kayan Officer</h3>
                <div class="creator-platform"><i class="fa-brands fa-youtube" style="color: #FF0000;"></i> يوتيوب - قطاع الشرطة والأمن</div>
                <a href="https://youtube.com" target="_blank" class="watch-btn" style="background: #FF0000;"><i class="fa-solid fa-play"></i> زيارة القناة</a>
            </div>
        </div>
    </div>
</body>
</html>
